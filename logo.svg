<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <!-- Stele: an inscribed stone pillar -->
  <!-- Tapered rectangular stone -->
  <path d="M 55 20 L 145 20 L 155 300 L 45 300 Z" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Rounded top -->
  <path d="M 55 20 Q 100 0 145 20" fill="#2d2d2d" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Inscribed horizontal lines (engravings) -->
  <line x1="72" y1="60" x2="128" y2="60" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="80" x2="130" y2="80" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="68" y1="100" x2="132" y2="100" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="66" y1="120" x2="134" y2="120" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="140" x2="136" y2="140" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Record delimiter engravings {| |} -->
  <text x="62" y="180" font-family="monospace" font-size="24" fill="#aaa" opacity="0.7">{|</text>
  <text x="118" y="180" font-family="monospace" font-size="24" fill="#aaa" opacity="0.7">|}</text>
  <!-- More inscribed lines below -->
  <line x1="60" y1="200" x2="140" y2="200" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="220" x2="142" y2="220" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="240" x2="144" y2="240" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="260" x2="146" y2="260" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Base -->
  <rect x="35" y="295" width="130" height="10" rx="2" fill="#1a1a1a"/>
</svg>
